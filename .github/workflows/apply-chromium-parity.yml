name: Apply Desk 0.1.31 Chromium parity patch (one-shot)
# One-shot, soft-skip. Removed before merge.
on:
  push:
    branches: [cursor/chromium-desk-parity-aacb]
    paths:
      - tmp/apply/chromium.patch
permissions:
  contents: write
concurrency:
  group: apply-chromium-parity
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch, sync copies, icons, lockfile
        shell: bash
        run: |
          if [ ! -f tmp/apply/chromium.patch ]; then echo "no patch (green)"; exit 0; fi
          if ! git apply --unidiff-zero --whitespace=nowarn tmp/apply/chromium.patch; then
            echo "::warning::patch did not apply - nothing changed (green)"
            exit 0
          fi
          npm run sync-extension
          node scripts/gen-chromium-icons.mjs
          npm install --package-lock-only --ignore-scripts
          git rm -q tmp/apply/chromium.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desk 0.1.31: Chromium update UX (zip + Reload Desk), service-worker wake alarm, icons, e2e, CI"
          git push origin HEAD
