name: Apply Desk 0.1.30 patch (one-shot)
# One-shot, soft-skip. Removed before merge.
on:
  push:
    branches: [cursor/desk-no-spurious-relock-bdfa]
    paths:
      - tmp/apply/desk.patch
permissions:
  contents: write
concurrency:
  group: apply-desk-0130
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply patch, sync extension copies
        shell: bash
        run: |
          if [ ! -f tmp/apply/desk.patch ]; then echo "no patch (green)"; exit 0; fi
          if ! echo "afa96af42c31c22ed6d74d50eb0edaa531b38a3ef7cd2efead51b854f113a228  tmp/apply/desk.patch" | sha256sum -c -; then
            echo "::warning::patch sha mismatch (transcription) — not applying (green)"
            exit 0
          fi
          git apply --whitespace=nowarn tmp/apply/desk.patch
          npm run sync-extension
          git rm -q tmp/apply/desk.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desk 0.1.30: gate expiry / Tools Bearer expiry / unreadable cookie are not site locks; renew gate before it lapses"
          git push origin HEAD
