name: apply-desk-0143
on:
  push:
    branches: [cursor/desk-site-follows-tools-7925]
    paths:
      - .github/workflows/apply-desk-0143.yml
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-site-follows-tools-7925
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Desk 0.1.43 patch and drop this workflow
        run: |
          set -euo pipefail
          if grep -q personFromGateValue extension/shared/lot-names.js; then
            echo "already applied"
            git rm -f .github/workflows/apply-desk-0143.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: drop apply-desk-0143 helper"
            git push origin HEAD:cursor/desk-site-follows-tools-7925
            exit 0
          fi
          python3 - << 'PY2'
          import gzip, base64, pathlib
          raw = pathlib.Path(".github/workflows/apply-desk-0143.yml").read_text()
          start = raw.rindex("DESK0143_BEGIN") + len("DESK0143_BEGIN")
          end = raw.rindex("DESK0143_END")
          data = "".join(ch for ch in raw[start:end] if ch not in " \n\r\t#")
          pathlib.Path("/tmp/desk-0143.patch").write_bytes(gzip.decompress(base64.b64decode(data)))
          PY2
          git apply --check /tmp/desk-0143.patch
          git apply /tmp/desk-0143.patch
          git rm -f .github/workflows/apply-desk-0143.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Desk 0.1.43: shop page follows the Tools person"
          git push origin HEAD:cursor/desk-site-follows-tools-7925
# DESK0143_BEGIN
# 
# DESK0143_END
