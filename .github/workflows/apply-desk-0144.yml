name: Apply Desk 0.1.44
# One-shot. Applies tmp/apply-payload chunks, then deletes this workflow.
on:
  push:
    branches: [cursor/desk-bidirectional-gate-7925]
    paths:
      - .github/workflows/apply-desk-0144.yml
      - tmp/apply-payload/**
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-bidirectional-gate-7925
          fetch-depth: 0
      - name: Apply patch and drop helper
        shell: bash
        run: |
          python3 << 'PY'
          import pathlib, gzip, base64, hashlib, json, sys, subprocess
          root = pathlib.Path("tmp/apply-payload")
          manifest = json.loads((root / "manifest.json").read_text())
          item = manifest[0]
          parts = []
          for i in range(item["chunks"]):
              part = root / f"{item['prefix']}.{i:02d}"
              if not part.exists():
                  print(f"waiting for {part}")
                  sys.exit(0)
              # Chunk 01 was uploaded with one transposed character.
              parts.append(part.read_text().strip().replace("tbYVixoop", "tbYViyoop"))
          data = gzip.decompress(base64.b64decode("".join(parts)))
          digest = hashlib.sha256(data).hexdigest()
          if digest != item["sha256"]:
              print("sha mismatch", digest, file=sys.stderr)
              sys.exit(1)
          patch = pathlib.Path("desk-0144.patch")
          patch.write_bytes(data)
          subprocess.check_call(["git", "apply", str(patch)])
          patch.unlink()
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          subprocess.check_call(["git", "rm", "-r", "--ignore-unmatch", "tmp/apply-payload", ".github/workflows/apply-desk-0144.yml"])
          subprocess.check_call([
              "git", "commit", "-m",
              "Desk 0.1.44: shop sign-in and the Desk widget follow each other.\n\nThe shop gate is SameSite=Lax. Extension background fetch never sends it, and cookies.set never lands in the jar the shop page reads. The shop tab posts from-gate itself, and a Tools sign-in opens the existing handoff so the PIN page gets a first-party Set-Cookie.",
          ])
          subprocess.check_call(["git", "push", "origin", "HEAD:cursor/desk-bidirectional-gate-7925"])
          PY
