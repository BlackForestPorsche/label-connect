name: apply-desk-017
on:
  push:
    branches: [cursor/tools-to-website-unlock-3d81]
    paths:
      - "payloads/desk-017-*"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and apply desk-017 payloads
        run: |
          set -euo pipefail
          python3 <<'PY'
          import gzip, base64, json, hashlib, pathlib, glob, subprocess, sys
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          errors = []

          # sed payloads first (tiny, safe)
          for fp in sorted(glob.glob("payloads/desk-017-*.sed.json")):
              try:
                  payload = json.loads(pathlib.Path(fp).read_text())
                  changed = []
                  for op in payload.get("sed") or []:
                      path = pathlib.Path(op["path"])
                      text = path.read_text()
                      count = text.count(op["old"])
                      expect = op.get("count", count)
                      if count != expect:
                          raise AssertionError(f"{fp} {op['path']} count {count} != {expect}")
                      path.write_text(text.replace(op["old"], op["new"]))
                      changed.append(op["path"])
                      print("sed", op["path"], count)
                  if not changed:
                      continue
                  subprocess.check_call(["git", "add", "--"] + changed)
                  if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode != 0:
                      subprocess.check_call(["git", "commit", "-m", payload.get("message") or f"Apply {fp}"])
              except Exception as e:
                  print("ERROR", fp, e)
                  errors.append(str(e))

          for meta_fp in sorted(glob.glob("payloads/desk-017-*.meta.json")):
              # Skip package-lock group if sed handled it
              if meta_fp.endswith("desk-017-02.meta.json") and pathlib.Path("payloads/desk-017-02.sed.json").exists():
                  print("skip meta", meta_fp, "(sed present)")
                  continue
              try:
                  meta = json.loads(pathlib.Path(meta_fp).read_text())
                  parts = [pathlib.Path(f"{meta['prefix']}{i}").read_text().strip() for i in range(meta["parts"])]
                  b64 = "".join(parts)
                  got = hashlib.md5(b64.encode()).hexdigest()
                  if got != meta["md5"]:
                      raise AssertionError(f"{meta_fp} b64 md5 {got} != {meta['md5']} lens={[len(p) for p in parts]}")
                  raw = gzip.decompress(base64.b64decode(b64))
                  got2 = hashlib.md5(raw).hexdigest()
                  if got2 != meta["item_md5"]:
                      raise AssertionError(f"{meta_fp} raw md5 {got2} != {meta['item_md5']}")
                  changed = []
                  for path in meta["paths"]:
                      p = pathlib.Path(path)
                      p.parent.mkdir(parents=True, exist_ok=True)
                      if p.exists() and p.read_bytes() == raw:
                          print("unchanged", path)
                          continue
                      p.write_bytes(raw)
                      changed.append(path)
                      print("wrote", path, len(raw))
                  if not changed:
                      continue
                  subprocess.check_call(["git", "add", "--"] + changed)
                  if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                      continue
                  subprocess.check_call(["git", "commit", "-m", meta.get("message") or f"Apply {meta_fp}"])
              except Exception as e:
                  print("ERROR", meta_fp, e)
                  errors.append(str(e))
          print(subprocess.run(["git", "status", "-sb"], capture_output=True, text=True).stdout)
          subprocess.check_call(["git", "push"])
          if errors:
              print("ERRORS:", errors)
              sys.exit(1)
          PY
