name: apply-desk-022
on:
  push:
    branches: [cursor/desk-022-apply-staged-23bb]
    paths:
      - "payloads/desk-022-*"
      - ".github/workflows/apply-desk-022.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode desk-022 payloads and commit
        run: |
          set -euo pipefail
          python3 <<'PY'
          import gzip, base64, json, hashlib, pathlib, glob, subprocess, re
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])

          # Assemble split payloads: foo.a.txt + foo.b.txt (+ foo.c.txt...) -> foo.json
          for a in sorted(glob.glob("payloads/desk-022-*.a.txt")):
              stem = a[:-6]  # strip .a.txt
              ordered = []
              for letter in "abcdefghijklmnopqrstuvwxyz":
                  p = f"{stem}.{letter}.txt"
                  if pathlib.Path(p).exists():
                      ordered.append(p)
                  else:
                      break
              if not ordered:
                  continue
              text = "".join(pathlib.Path(p).read_text() for p in ordered)
              out = pathlib.Path(stem + ".json")
              out.write_text(text)
              print("assembled", out, "from", ordered, "len", len(text))

          def write_bytes(path_str, raw):
              path = pathlib.Path(path_str)
              path.parent.mkdir(parents=True, exist_ok=True)
              if path.exists() and path.read_bytes() == raw:
                  print("unchanged", path_str)
                  return False
              path.write_bytes(raw)
              print("wrote", path_str, len(raw))
              return True

          for fp in sorted(glob.glob("payloads/desk-022-*.json")):
              payload = json.loads(pathlib.Path(fp).read_text())
              changed = []
              for item in payload.get("items") or []:
                  raw = gzip.decompress(base64.b64decode(item["gzipBase64"]))
                  assert hashlib.md5(raw).hexdigest() == item["md5"], item["path"]
                  if write_bytes(item["path"], raw):
                      changed.append(item["path"])
              if not changed:
                  print("no change for", fp)
                  continue
              subprocess.check_call(["git", "add", "--"] + changed)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  continue
              subprocess.check_call(["git", "commit", "-m", payload.get("message") or f"Apply {fp}"])
              print("committed", fp)
          subprocess.check_call(["git", "push", "origin", "HEAD"])
          print("push done")
          PY
