name: Apply Desk 0.1.26 combined Hub sources
# Incomplete chunks exit green — never FileNotFound mid-upload.
on:
  push:
    branches: [cursor/desk-026-hub-ship-b196]
    paths:
      - tmp/desk-026-apply/**
      - .github/workflows/apply-desk-026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-desk-026-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-026-hub-ship-b196
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode Desk 0.1.26 chunks (soft-skip incomplete)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import gzip, base64, hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path("tmp/desk-026-apply")
          man_path = root / "manifest.json"
          if not man_path.exists():
              print("No manifest — green wait")
              sys.exit(0)
          man = json.loads(man_path.read_text())
          for item in man:
              parts = []
              for i in range(item["chunks"]):
                  p = root / f"{item['prefix']}.{i:02d}"
                  if not p.exists():
                      print(f"incomplete, waiting for {p} (green)")
                      sys.exit(0)
                  parts.append(p.read_text().strip())
              try:
                  raw = gzip.decompress(base64.b64decode("".join(parts)))
              except Exception as e:
                  print(f"decode not ready: {e} (green)")
                  sys.exit(0)
              digest = hashlib.sha256(raw).hexdigest()
              if digest != item["sha256"]:
                  print(f"sha mismatch {item['path']} — green wait")
                  sys.exit(0)
              path = pathlib.Path(item["path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              print("wrote", path, len(raw))
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          st = subprocess.call(["git", "diff", "--cached", "--quiet"])
          if st != 0:
              subprocess.check_call(["git", "commit", "-m", "fix(desk): apply 0.1.26 combined Hub sources (Update+sync+scrape+unlock-hold)"])
              subprocess.check_call(["git", "push"])
          else:
              print("no changes")
          PY
