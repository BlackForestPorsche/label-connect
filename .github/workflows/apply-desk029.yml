name: apply-desk029
on:
  push:
    branches: [cursor/desk-029-logged-in-icon-1a41]
    paths: ["tmp/desk029/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch, sync, test, commit
        run: |
          set -euo pipefail
          if [ ! -f tmp/desk029/desk029.patch ]; then echo "no patch (green)"; exit 0; fi
          echo "$(cat tmp/desk029/sha256)  tmp/desk029/desk029.patch" | sha256sum -c -
          git apply tmp/desk029/desk029.patch
          npm ci --silent
          npm run sync-extension
          npm test
          rm -rf tmp/desk029
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desk 0.1.29: logged-in popup, green/red icon, honest Update button"
          git push origin HEAD
