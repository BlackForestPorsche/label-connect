name: apply-desk029c
on:
  push:
    branches: [cursor/desk-029-combined-1a41]
    paths: ["tmp/desk029c/**"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch, sync, test, commit
        run: |
          set -euo pipefail
          if [ ! -f tmp/desk029c/patch.b64 ]; then echo "no patch (green)"; exit 0; fi
          base64 -d tmp/desk029c/patch.b64 | gunzip > /tmp/combo.patch
          echo "$(cat tmp/desk029c/sha256)  /tmp/combo.patch" | sha256sum -c -
          git apply /tmp/combo.patch
          npm ci --silent
          npm run sync-extension
          npm test
          rm -rf tmp/desk029c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desk 0.1.29: logged-in popup, green/red icon on top of Update apply fix"
          git push origin HEAD
