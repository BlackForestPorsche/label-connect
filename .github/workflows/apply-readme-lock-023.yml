name: apply-readme-lock-023
on:
  push:
    branches: [cursor/label-skipped-could-not-read-14e9]
    paths: [".agent-push/readme.md.gz.b64", ".agent-push/package-lock.json.gz.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/label-skipped-could-not-read-14e9
      - name: Decode README + package-lock
        run: |
          python3 <<'PY'
          import gzip, base64
          from pathlib import Path
          def decode(src, dest):
              b64 = Path(src).read_text().strip()
              data = gzip.decompress(base64.b64decode(b64))
              Path(dest).write_bytes(data)
              print("wrote", dest, len(data))
          decode(".agent-push/readme.md.gz.b64", "extension/README.md")
          decode(".agent-push/package-lock.json.gz.b64", "package-lock.json")
          assert b"linkedom" in Path("package-lock.json").read_bytes()
          assert b"could not read last name or model" in Path("extension/README.md").read_bytes()
          PY
      - name: Commit
        run: |
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git add extension/README.md package-lock.json
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "chore(desk): restore full README + package-lock linkedom (0.1.23)"
          git push
