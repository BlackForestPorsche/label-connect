name: apply-readme-only-023
on:
  workflow_dispatch:
  push:
    branches: [cursor/label-skipped-could-not-read-14e9]
    paths: [".agent-push/RESTORE_README"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/label-skipped-could-not-read-14e9
          fetch-depth: 0
      - name: Decode README from gz.b64
        run: |
          python3 <<'PY'
          import gzip, base64
          from pathlib import Path
          b64 = Path(".agent-push/readme.md.gz.b64").read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          Path("extension/README.md").write_bytes(data)
          assert b"could not read last name or model" in data
          assert b"SSF" in data
          print("wrote", len(data))
          PY
      - name: Commit
        run: |
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git add extension/README.md
          git stash push -u -m tmp || true
          git pull --rebase origin cursor/label-skipped-could-not-read-14e9 || true
          git stash pop || true
          git add extension/README.md
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "docs(desk): restore full extension README (0.1.23)"
          git push
