name: apply-readme-plain-023
on:
  push:
    branches: [cursor/label-skipped-could-not-read-14e9]
    paths: [".agent-push/readme.b64.00"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/label-skipped-could-not-read-14e9
          fetch-depth: 0
      - name: Decode README
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path
          parts = sorted(Path(".agent-push").glob("readme.b64.*"))
          b64 = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          Path("extension/README.md").write_bytes(data)
          assert b"could not read last name or model" in data
          assert b"SSF" in data
          print("wrote", len(data))
          PY
      - name: Commit
        run: |
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git pull --rebase origin cursor/label-skipped-could-not-read-14e9 || true
          git add extension/README.md
          if git diff --cached --quiet; then echo no changes; exit 0; fi
          git commit -m "docs(desk): restore full extension README (0.1.23)"
          git push
