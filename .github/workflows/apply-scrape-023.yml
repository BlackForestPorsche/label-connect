name: apply-scrape-023
on:
  push:
    branches: [cursor/label-skipped-could-not-read-14e9]
    paths: [".agent-push/scrape.js.gz.b64"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/label-skipped-could-not-read-14e9
      - name: Decode scrape.js into extension trees
        run: |
          python3 <<'PY'
          import gzip, base64
          from pathlib import Path
          b64 = Path(".agent-push/scrape.js.gz.b64").read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          assert b"valueFromFieldWrapper" in data
          assert b"isPlateOrAccountNoise" in data
          for p in [
              "extension/shared/scrape.js",
              "extension/firefox/scrape.js",
              "extension/chromium/scrape.js",
          ]:
              Path(p).write_bytes(data)
              print("wrote", p, len(data))
          PY
      - name: Commit applied scrape.js
        run: |
          git config user.name "cursoragent"
          git config user.email "cursoragent@cursor.com"
          git add extension/shared/scrape.js extension/firefox/scrape.js extension/chromium/scrape.js
          if git diff --cached --quiet; then
            echo "no scrape changes"
            exit 0
          fi
          git commit -m "fix(desk): apply scrape.js Create RO association (0.1.23)"
          git push
