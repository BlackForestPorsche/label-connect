name: Apply unlock-sync payloads
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/unlock-sync-fix-36c9
    paths:
      - .github/workflows/apply-unlock-sync.yml
      - payloads/unlock-sync/**
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply unlock-sync patches and lockfile
        shell: bash
        run: |
          python3 <<'PY'
          import pathlib, gzip, base64, hashlib, json, subprocess, sys
          root = pathlib.Path("payloads/unlock-sync")
          man = json.loads((root / "manifest.json").read_text())
          def join_parts(prefix, n):
              parts = []
              for i in range(n):
                  p = root / f"{prefix}.{i:02d}"
                  if not p.exists():
                      print(f"missing {p}", file=sys.stderr)
                      sys.exit(1)
                  parts.append(p.read_text().strip())
              return "".join(parts)
          changed = []
          reps_b64 = join_parts("replacements.json.gz.b64", man["reps_parts"])
          reps_raw = gzip.decompress(base64.b64decode(reps_b64))
          if hashlib.sha256(reps_raw).hexdigest() != man["reps_sha256"]:
              print("reps sha mismatch", file=sys.stderr)
              sys.exit(1)
          payload = json.loads(reps_raw.decode())
          for rep in payload["replacements"]:
              old, new = rep["old"], rep["new"]
              for rel in rep["paths"]:
                  path = pathlib.Path(rel)
                  text = path.read_text()
                  if new in text and old not in text:
                      print(f"already applied {rel}")
                      continue
                  if old not in text:
                      print(f"missing old snippet in {rel}", file=sys.stderr)
                      sys.exit(1)
                  if text.count(old) != 1:
                      print(f"old snippet not unique in {rel}: {text.count(old)}", file=sys.stderr)
                      sys.exit(1)
                  path.write_text(text.replace(old, new, 1))
                  changed.append(rel)
                  print(f"patched {rel}")
          lock_b64 = join_parts("package-lock.json.gz.b64", man["lock_parts"])
          lock_data = gzip.decompress(base64.b64decode(lock_b64))
          if hashlib.sha256(lock_data).hexdigest() != man["lock_sha256"]:
              print("lock sha mismatch", file=sys.stderr)
              sys.exit(1)
          path = pathlib.Path("package-lock.json")
          if path.exists() and path.read_bytes() == lock_data:
              print("unchanged package-lock.json")
          else:
              path.write_bytes(lock_data)
              changed.append("package-lock.json")
              print(f"wrote package-lock.json {len(lock_data)}")
          if not changed:
              print("No changes")
              sys.exit(0)
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "--"] + changed)
          subprocess.check_call(["git", "commit", "-m", "fix(desk): apply unlock sync sources (0.1.22)"])
          subprocess.check_call(["git", "push", "origin", "HEAD"])
          PY
