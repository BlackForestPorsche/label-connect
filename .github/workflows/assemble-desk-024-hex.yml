name: Assemble Desk 0.1.24 hex parts
# Incomplete hex parts exit green — never fail mid-upload (Logan email spam).
on:
  push:
    branches: [cursor/desk-024-update-apply-sync-b196]
    paths:
      - tmp/desk-024-hex/**
      - .github/workflows/assemble-desk-024-hex.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-desk-024-hex-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-024-update-apply-sync-b196
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble hex parts (soft-skip incomplete)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path("tmp/desk-024-hex")
          man_path = root / "manifest.json"
          if not man_path.exists():
              print("No manifest — green wait")
              sys.exit(0)
          man = json.loads(man_path.read_text())
          for key, meta in man.items():
              parts = []
              for i in range(meta["n"]):
                  p = root / f"{key}.{i:02d}.hex"
                  if not p.exists():
                      print(f"incomplete, waiting for {p} (green)")
                      sys.exit(0)
                  parts.append(p.read_text().strip())
              try:
                  text = bytes.fromhex("".join(parts)).decode("ascii")
              except Exception as e:
                  print(f"hex decode not ready: {e} (green)")
                  sys.exit(0)
              digest = hashlib.sha256(text.encode()).hexdigest()
              if digest != meta["sha256"] or len(text) != meta["len"]:
                  print(f"digest/len mismatch for {key} — green wait (parts may still be landing)")
                  sys.exit(0)
              for target in meta["targets"]:
                  path = pathlib.Path(target)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text)
                  print("wrote", path, len(text), digest[:12])
          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "add", "-A"])
          if subprocess.call(["git", "diff", "--cached", "--quiet"]) != 0:
              subprocess.check_call(["git", "commit", "-m", "ci(desk): assemble 0.1.24 apply chunks from hex parts"])
              subprocess.check_call(["git", "push"])
          else:
              print("no changes")
          PY
