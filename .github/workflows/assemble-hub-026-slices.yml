name: assemble-hub-026-slices
on:
  workflow_dispatch:
  push:
    paths:
      - "tmp/desk-026-slices/**"
      - ".github/workflows/assemble-hub-026-slices.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-026-hub-ship-b196
      - name: Assemble unique slices to hub paths
        run: |
          python3 <<'PY'
          import hashlib, pathlib
          targets = [(['tmp/desk-026-apply/extension__shared__lot-names.js.00', 'tmp/desk-026-apply/extension__firefox__lot-names.js.00', 'tmp/desk-026-apply/extension__chromium__lot-names.js.00'], 21, 'ad512b4e92b569cdb093074f2c3e3b6383c339696ff99331eb06031e7dda43c8', 'c00'), (['tmp/desk-026-apply/extension__shared__content-shop.js.00', 'tmp/desk-026-apply/extension__firefox__content-shop.js.00', 'tmp/desk-026-apply/extension__chromium__content-shop.js.00'], 7, '59eaf99b0c0b8eb1506bb582ae7f3c3fb593aac71244407bebba12ebb6573c5a', 'c01'), (['tmp/desk-026-apply/test__tools-site-sync.test.mjs.00'], 4, '6c6783332987eab73068658a131d80d65635d28165686163e04c51380c873ab7', 'c02'), (['tmp/desk-026-apply/extension__version.json.00'], 1, '4144c5756a4eef30b79740d2241ba678e019dddd8068b1b5c9537d6e53ed3ef2', 'c03')]
          root = pathlib.Path("tmp/desk-026-slices")
          for paths, n, digest, key in targets:
              parts=[]
              for i in range(n):
                  p = root / f"{key}.{i:03d}"
                  if not p.exists():
                      print("incomplete", p); raise SystemExit(0)
                  parts.append(p.read_text())
              content="".join(parts)
              got=hashlib.sha256(content.encode()).hexdigest()
              if got!=digest:
                  raise SystemExit(f"sha mismatch {key}: {got} != {digest}")
              for path in paths:
                  dest=pathlib.Path(path)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_text(content)
                  print("ok", path, len(content))
          print("assemble-ok")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/desk-026-apply
          if git diff --cached --quiet; then echo no changes; else
            git commit -m "ci(desk): assemble hub-00..04 exact desk-026-apply chunks"
            git push origin HEAD:cursor/desk-026-hub-ship-b196
          fi
