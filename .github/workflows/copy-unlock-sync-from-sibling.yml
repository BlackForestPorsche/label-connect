name: Copy unlock-sync sources from sibling branch
on:
  workflow_dispatch:
  push:
    branches: [cursor/unlock-sync-fix-36c9b]
    paths:
      - .github/workflows/copy-unlock-sync-from-sibling.yml
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/unlock-sync-fix-36c9b
          fetch-depth: 0
      - name: Copy applied unlock-sync sources from sibling tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cursor/unlock-sync-fix-36c9
          SRC=origin/cursor/unlock-sync-fix-36c9
          files=(
            extension/shared/background.js
            extension/shared/content-shop.js
            extension/shared/lot-names.js
            extension/shared/popup.js
            extension/firefox/background.js
            extension/firefox/content-shop.js
            extension/firefox/lot-names.js
            extension/firefox/popup.js
            extension/chromium/background.js
            extension/chromium/content-shop.js
            extension/chromium/lot-names.js
            extension/chromium/popup.js
            test/tools-site-sync.test.mjs
            package-lock.json
            README.md
            .github/workflows/apply-unlock-sync.yml
            payloads/unlock-sync/manifest.json
            payloads/unlock-sync/package-lock.json.gz.b64.00
            payloads/unlock-sync/package-lock.json.gz.b64.01
            payloads/unlock-sync/package-lock.json.gz.b64.02
            payloads/unlock-sync/replacements.json.gz.b64.00
            payloads/unlock-sync/replacements.json.gz.b64.01
          )
          for f in "${files[@]}"; do
            git checkout "$SRC" -- "$f"
            echo "copied $f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(desk): copy unlock sync sources from sibling (0.1.22)"
          git push origin HEAD
