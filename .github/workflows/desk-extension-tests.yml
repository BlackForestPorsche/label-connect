name: desk-extension-tests
# Unit + manifest parity for Firefox/Chromium Desk, plus a real-Chrome load-unpacked smoke
# (lock/unlock sync, latch, Create RO print, SSF dropdown). No store publishing here.
on:
  pull_request:
    paths:
      - "extension/**"
      - "test/**"
      - "scripts/gen-chromium-icons.mjs"
      - "package.json"
      - ".github/workflows/desk-extension-tests.yml"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
  chromium-e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chrome load-unpacked e2e
        run: xvfb-run -a npm run test:chromium
