name: open-desk-0143-pr
on:
  push:
    branches: [cursor/desk-site-follows-tools-7925]
    paths:
      - .github/workflows/open-desk-0143-pr.yml
jobs:
  open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-site-follows-tools-7925
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Open pull request and drop this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$BODY_B64" | base64 -d > /tmp/pr-body.md
          url=$(gh pr list --repo BlackForestPorsche/label-connect --head cursor/desk-site-follows-tools-7925 --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo BlackForestPorsche/label-connect --base main --head cursor/desk-site-follows-tools-7925 --title "Desk 0.1.43: shop page follows the Tools person" --body-file /tmp/pr-body.md)
          fi
          echo "Opened $url"
          git rm -f .github/workflows/open-desk-0143-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: drop open-pr helper"
          git push origin HEAD:cursor/desk-site-follows-tools-7925
