name: patch-desk-024-hex-sb-tails
on:
  push:
    branches: [cursor/desk-024-update-apply-sync-b196]
    paths: [.github/workflows/patch-desk-024-hex-sb-tails.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-024-update-apply-sync-b196
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append exact tails for shared_bg.02 and .03
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib

          tails = {
            "shared_bg.02": (
              "\n",
              "cc588c3695f4",
            ),
            "shared_bg.03": (
              "\n",
              "256ef957ebee",
            ),
          }

          for name, (tail, expect12) in tails.items():
              p = Path(f"tmp/desk-024-hex/{name}.hex")
              cur = p.read_text()
              if cur.endswith("\n") and len(cur) > 2500:
                  print(name, "already final-ish", len(cur))
              if len(cur.rstrip("\n")) != 2500 and len(cur) != 2500:
                  raise SystemExit(f"{name} unexpected len {len(cur)}")
              base = cur[:2500] if not cur[:2500].endswith("\n") else cur[:2499]
              # remote is exact 2500 without needing strip
              base = cur if len(cur) == 2500 else cur.rstrip("\n")[:2500]
              if len(base) != 2500:
                  raise SystemExit(f"{name} base len {len(base)}")
              text = base + tail
              # tail already includes \n
              h = hashlib.sha256(text.encode()).hexdigest()[:12]
              print(name, "len", len(text), "hash12", h, "expect", expect12)
              if h != expect12:
                  raise SystemExit(f"{name} hash mismatch")
              p.write_text(text)
              print(name, "wrote ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/desk-024-hex/shared_bg.02.hex tmp/desk-024-hex/shared_bg.03.hex
          git diff --cached --quiet || git commit -m "ci(desk): hex shared_bg.02/.03 exact final tails"
          git push
