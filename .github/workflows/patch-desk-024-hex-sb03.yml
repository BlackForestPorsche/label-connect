name: patch-desk-024-hex-sb03
on:
  push:
    branches: [cursor/desk-024-update-apply-sync-b196]
    paths: [.github/workflows/patch-desk-024-hex-sb03.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/desk-024-update-apply-sync-b196
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix four chars in shared_bg.03.hex
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("tmp/desk-024-hex/shared_bg.03.hex")
          t = list(p.read_text())
          # Expected local[:2500] sha12 65a28d444bc0 — fix known flips 25→44
          for i in (381, 382, 1753, 1754):
              print(f"before {i}={t[i]!r}")
              t[i] = "4"
              print(f"after  {i}={t[i]!r}")
          text = "".join(t)
          # Ensure exactly 2500 prefix of final file (no trailing nl yet) or keep as-is length
          p.write_text(text)
          h = hashlib.sha256(text.encode()).hexdigest()[:12]
          print("len", len(text), "hash12", h)
          if h != "65a28d444bc0" and len(text) == 2500:
              raise SystemExit(f"unexpected hash {h}")
          if len(text) == 2500 and h == "65a28d444bc0":
              print("exact 2500 ok")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/desk-024-hex/shared_bg.03.hex
          git diff --cached --quiet || git commit -m "ci(desk): hex shared_bg.03 exact 2500b patched"
          git push
