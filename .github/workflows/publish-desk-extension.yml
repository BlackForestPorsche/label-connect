name: publish-desk-extension
# Publishes the stable GitHub Release tag `desk-extension` (XPI + chromium zip).
# Main-only: feature-branch pushes used to race on the same asset names and spam
# "run failed" emails. Unsigned pack/publish is expected — no AMO secrets required.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-desk-extension.yml"
      - "scripts/pack-desk-extension.sh"
      - "scripts/gh-release-desk-extension.sh"
      - "extension/firefox/**"
      - "extension/chromium/**"
      - "extension/shared/**"
      - "extension/version.json"
  workflow_dispatch:
concurrency:
  group: publish-desk-extension
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack and publish desk-extension release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          bash scripts/pack-desk-extension.sh
          ls -la extension/dist/
          test -f extension/dist/Black.Forest.Desk.xpi
          test -f extension/dist/Black.Forest.Desk-chromium.zip
          bash scripts/gh-release-desk-extension.sh
