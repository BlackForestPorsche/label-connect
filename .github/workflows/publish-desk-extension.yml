name: publish-desk-extension
# Publishes stable GitHub Release tag `desk-extension` (XPI + updates.json + chromium zip).
# Main-only (+ workflow_dispatch): feature-branch pushes must not publish (PR #11).
# Unsigned pack/publish stays green when AMO secrets are absent; signing is optional.
# Secrets (repo Actions — never paste into chat):
#   WEB_EXT_API_KEY + WEB_EXT_API_SECRET
#   or AMO_JWT_ISSUER + AMO_JWT_SECRET
# Create/revoke at https://addons.mozilla.org/developers/addon/api/key/
# Add at https://github.com/BlackForestPorsche/label-connect/settings/secrets/actions
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-desk-extension.yml"
      - "scripts/pack-desk-extension.sh"
      - "scripts/gh-release-desk-extension.sh"
      - "scripts/generate-desk-updates-json.sh"
      - "scripts/sign-desk-extension.sh"
      - "extension/firefox/**"
      - "extension/chromium/**"
      - "extension/shared/**"
      - "extension/version.json"
  workflow_dispatch:
concurrency:
  group: publish-desk-extension
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack desk extension
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          bash scripts/pack-desk-extension.sh
          ls -la extension/dist/
          test -f extension/dist/Black.Forest.Desk.xpi
          test -f extension/dist/Black.Forest.Desk-chromium.zip
          test -f extension/dist/updates.json
          # AMO Hub “On this site” pack (no update_url) — versioned name from extension/version.json
          VER="$(python3 -c "import json; print(json.load(open('extension/version.json'))['version'])")"
          test -f "extension/dist/Black.Forest.Desk-${VER}-amo-hosted.xpi"
      - name: Sign Firefox XPI (AMO unlisted) when secrets exist
        id: sign
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          export WEB_EXT_API_KEY="${WEB_EXT_API_KEY:-${AMO_JWT_ISSUER:-}}"
          export WEB_EXT_API_SECRET="${WEB_EXT_API_SECRET:-${AMO_JWT_SECRET:-}}"
          if [[ -z "${WEB_EXT_API_KEY}" || -z "${WEB_EXT_API_SECRET}" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AMO / web-ext secrets missing — publishing unsigned XPI + updates.json. Job stays green. Add WEB_EXT_API_KEY + WEB_EXT_API_SECRET (or AMO_JWT_ISSUER + AMO_JWT_SECRET) for a Mozilla-signed installable XPI. Never paste JWT values into chat — only GitHub Settings → Secrets."
            exit 0
          fi
          bash scripts/sign-desk-extension.sh
          bash scripts/generate-desk-updates-json.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::AMO web-ext sign succeeded (unlisted / self-dist). Signed XPI will be published to desk-extension release."
          ls -la extension/dist/
      - name: Publish desk-extension release (XPI + updates.json + chromium)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/gh-release-desk-extension.sh
