<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Black Forest Desk</title>
    <style>
      :root {
        color-scheme: light;
        font: 13px/1.4 system-ui, sans-serif;
        color: #1c1914;
        --green: #1f4d2a;
        --green-dark: #173a20;
        --red: #7a1f1f;
        --line: #d9d1bf;
        --border: #b9b2a4;
        --muted: #5f5848;
      }
      body {
        margin: 0;
        width: 300px;
        padding: 12px 14px;
        background: #f3efe6;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      label {
        display: block;
        margin: 0 0 4px;
        font-weight: 600;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 8px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      input::placeholder {
        color: #8a8373;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--green);
        outline-offset: 1px;
      }
      button {
        width: 100%;
        box-sizing: border-box;
        min-height: 32px;
        padding: 6px 10px;
        border: 1px solid var(--green);
        border-radius: 5px;
        background: var(--green);
        color: #f4f1ea;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--green-dark);
      }
      button.secondary {
        margin-top: 8px;
        border-color: var(--border);
        background: #fbf9f4;
        color: #1c1914;
      }
      button.secondary:hover:not(:disabled) {
        background: #ebe5d7;
      }
      button.accent {
        margin-top: 8px;
        border-color: #8a5a12;
        background: #8a5a12;
      }
      button.accent:hover:not(:disabled) {
        background: #6f480e;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
      #loggedIn,
      #signInState {
        display: flex;
        gap: 9px;
        margin: 0 0 10px;
        padding: 8px 11px;
        border-radius: 6px;
      }
      #loggedIn::before,
      #signInState::before {
        content: "";
        flex: none;
        width: 9px;
        height: 9px;
        margin-top: 5px;
        border-radius: 50%;
      }
      #loggedIn {
        background: #e3efe5;
        color: var(--green);
        font-size: 14px;
        font-weight: 700;
      }
      #loggedIn::before {
        background: #2e7d32;
      }
      #signInState {
        background: #f5e4e0;
        color: #5c1717;
      }
      #signInState::before {
        background: #c62828;
      }
      #signInState.checking {
        background: #ebe5d7;
        color: var(--muted);
      }
      #signInState.checking::before {
        background: #a39b88;
      }
      #loginBox {
        margin-bottom: 0;
      }
      #loginBox button + label {
        margin-top: 10px;
      }
      #status,
      #update {
        margin-top: 10px;
        font-weight: 600;
      }
      #status:empty,
      #update:empty,
      #version:empty,
      #dwightKeyHint:empty,
      #followTestStatus:empty {
        display: none;
      }
      .section {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      .section > button:first-child {
        margin-top: 0;
      }
      .section input {
        margin-bottom: 6px;
      }
      .ok { color: var(--green); }
      .err { color: var(--red); }
      .warn { color: #6a4a12; }
      .meta {
        margin: 0;
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 500;
      }
      .meta.err {
        color: var(--red);
        font-weight: 600;
      }
      #version {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Black Forest Desk</h1>
    <div id="loggedIn" role="status" hidden></div>
    <div id="loginBox">
      <p id="signInState" class="checking" role="status">Checking Tools and the shop site…</p>
      <button id="useShopSession" type="button">Sync shop session</button>
      <button id="useTools" class="secondary" type="button">Sync Tools → website</button>
      <label for="person">Person</label>
      <select id="person" autocomplete="username" aria-label="Shop person"></select>
      <label for="pin">Desk PIN</label>
      <input id="pin" type="password" autocomplete="current-password" inputmode="numeric" placeholder="4 to 12 digits" />
      <button id="unlock" class="secondary" type="button">Unlock with desk PIN</button>
      <div id="status" role="status"></div>
    </div>
    <div class="section">
      <label for="dwightCreateRoToken">Create RO listener key</label>
      <input
        id="dwightCreateRoToken"
        type="password"
        autocomplete="off"
        spellcheck="false"
        placeholder="Paste once"
      />
      <p id="dwightKeyHint" class="meta" role="status"></p>
    </div>
    <div class="section">
      <p class="meta">Posts a sample R/O to Tools at <code>http://127.0.0.1:8788/v1/follow</code> so you can verify Follow without opening AllData. Turn on <strong>Follow AllData R/O</strong> in Tools first.</p>
      <button id="followTestPing" class="secondary" type="button">Test Follow ping</button>
      <p id="followTestStatus" class="meta" role="status"></p>
    </div>
    <div class="section">
      <button id="checkUpdate" class="secondary" type="button">Check for update</button>
      <button id="applyUpdate" class="accent" type="button" hidden>Update</button>
      <button id="reloadDesk" class="secondary" type="button" hidden>Reload Desk</button>
      <div id="update" role="status"></div>
      <div id="version" class="meta"></div>
    </div>
    <script src="lot-names.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
